<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法務局 地図XML（公図）ビューア（都心5区テスト版）</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <!-- Load zip.js for client-side zip file parsing with range requests support -->
    <script src="js/zip.min.js"></script>
    <!-- GSI Reverse Geocoding Dictionary for City Names -->
    <script>var GSI = {};</script>
    <script src="https://maps.gsi.go.jp/js/muni.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🗺️</span>
                    <h1>公図XMLビューア（都心5区テスト版）</h1>
                </div>
            </div>

            <!-- Detail Info Panel -->
            <section class="panel detail-panel" id="detailPanel">
                <h2>ℹ️ 筆（土地）の詳細情報</h2>
                <div class="detail-content" id="detailContent">
                    <p class="empty-msg" style="padding: 10px 0;">筆を選択すると詳細情報が表示されます</p>
                </div>
            </section>

            <!-- Arbitrary Maps Section -->
            <section class="panel area-panel" id="arbitraryMapsPanel">
                <h2>📍 周辺の任意座標系図面</h2>
                <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">地図を移動すると、中心付近の図面が表示されます。</p>
                <div id="arbitraryList" style="max-height: 250px; overflow-y: auto; font-size: 12px;">
                    <!-- List items will be injected here -->
                    <div style="padding: 10px; color: #666;">読み込み中...</div>
                </div>
            </section>

        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header bar with map info -->
            <header class="map-header">
                <div class="map-info">
                    <h2 id="mapTitle" style="font-size: 16px; font-weight: 600; margin: 0; color: #1e293b; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></h2>
                </div>
                
                <div class="header-search" style="flex-grow: 1; margin: 0 15px; display: flex; max-width: 400px;">
                    <input type="text" id="addressSearchInput" placeholder="住所で検索 (例: 新宿区西新宿２丁目)" style="flex-grow: 1; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 4px 0 0 4px; font-size: 13px;">
                    <button id="addressSearchBtn" style="padding: 6px 12px; background: #3b82f6; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 13px;">検索</button>
                </div>
                
                <div class="header-actions" style="display: flex; gap: 8px;">
                    <button id="closeXmlBtn" class="btn btn-secondary" style="display: none; background: #ef4444; color: white; border: none;">✖ 背景地図に戻る</button>
                    <button id="printExecuteBtn" class="btn btn-primary" style="display: none;">🖨️ 印刷実行</button>
                    <button id="printModeBtn" class="btn btn-secondary" style="display: none;">🖨️ 印刷モード</button>
                    <button id="resetViewBtn" class="btn btn-secondary" style="display: none;">🌐 フィット表示</button>
                    <button id="openSettingsBtn" class="btn btn-icon" title="設定" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px;">⚙️</button>
                </div>
            </header>

            <!-- Map Viewport -->
            <div class="viewport-container" id="viewportContainer">
                <canvas id="mapCanvas" style="position: absolute; top: 0; left: 0; z-index: 5;"></canvas>
                
                <!-- Loading overlay -->
                <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                    <div class="loading-spinner"></div>
                    <div class="loading-message" id="loadingMessage">ファイルを処理中...</div>
                </div>
                
                <!-- Map Attribution -->
                <div id="mapAttribution" style="display: none; position: absolute; bottom: 5px; right: 5px; z-index: 10; background-color: rgba(255,255,255,0.7); padding: 2px 5px; font-size: 11px; border-radius: 3px; pointer-events: auto;">
                    <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: none;">出典：国土地理院</a>
                </div>
                

                
                <!-- Zoom/Pan controls overlay -->
                <div class="controls-overlay">
                    <button id="zoomInBtn" title="拡大">+</button>
                    <button id="zoomOutBtn" title="縮小">−</button>
                    <button id="resetViewBtnOverlay" title="中心に戻す">🎯</button>
                </div>

                <!-- Hover detail tooltip -->
                <div class="hover-tooltip" id="hoverTooltip"></div>
            </div>

            <!-- Bottom Status Bar -->
            <footer class="status-bar">
                <div class="status-item" id="statusCoords" style="margin-right: 15px;">X: --, Y: --</div>
                <div class="status-item" id="statusHovered" style="margin-right: 15px;">選択中: なし</div>
                <div class="status-item" id="statusPublicMap" style="margin-right: 15px;"></div>
                <div class="status-item" id="statusScale"></div>
                <div class="status-item" id="statusDebug" style="color: #64748b; margin-left: auto; font-size: 12px;"></div>
            </footer>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h2>⚙️ 表示設定</h2>
                <button id="closeSettingsBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-group">
                    <h3>🎨 カラー設定</h3>
                    <div class="settings-row">
                        <label for="lineColorPicker">線の色</label>
                        <input type="color" id="lineColorPicker" value="#ef4444">
                    </div>
                    <div class="settings-row">
                        <label for="textColorPicker">文字の色</label>
                        <input type="color" id="textColorPicker" value="#000000">
                    </div>
                </div>
                
                <div class="settings-group">
                    <h3>🗺️ 背景地図（地理院タイル）</h3>
                    <div class="tile-options">
                        <div class="tile-option" data-tile="pale">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/pale/14/14552/6451.png');"></div>
                            <span>淡色地図</span>
                        </div>
                        <div class="tile-option" data-tile="std">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/std/14/14552/6451.png');"></div>
                            <span>標準地図</span>
                        </div>
                        <div class="tile-option" data-tile="seamlessphoto">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/14/14552/6451.jpg');"></div>
                            <span>全国最新写真</span>
                        </div>
                        <div class="tile-option" data-tile="blank">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/blank/14/14552/6451.png'); border: 1px solid #ccc;"></div>
                            <span>白地図</span>
                        </div>
                        <div class="tile-option" data-tile="relief">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/relief/14/14552/6451.png');"></div>
                            <span>色別標高図</span>
                        </div>
                        <div class="tile-option" data-tile="hillshade">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/hillshade/14/14552/6451.png');"></div>
                            <span>陰影起伏図</span>
                        </div>
                        <div class="tile-option" data-tile="slopemap">
                            <div class="tile-preview" style="background-image: url('https://cyberjapandata.gsi.go.jp/xyz/slopemap/14/14552/6451.png');"></div>
                            <span>傾斜量図</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettingsBtn" class="btn btn-primary" style="width: 100%;">保存</button>
            </div>
        </div>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
    <script src="js/slippy_map.js"></script>
</body>
</html>
